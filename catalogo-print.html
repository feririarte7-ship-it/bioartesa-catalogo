const CATEGORIES = ["Panadería y repostería", "Chocolates", "Frutos secos", "Deshidratados"];
const VALID_PRODUCTS = PRODUCTS.filter(p => CATEGORIES.includes(p.categoria) && p.precio <= 15);
const BY_CATEGORY = {};
CATEGORIES.forEach(cat => {
  BY_CATEGORY[cat] = VALID_PRODUCTS.filter(p => p.categoria === cat);
});

const html = document.documentElement;

// Generar páginas por categoría
Object.entries(BY_CATEGORY).forEach(([cat, products]) => {
  // Separador de categoría
  const divider = document.createElement('div');
  divider.className = 'page category-divider';
  divider.innerHTML = `<h2>${cat}</h2>`;
  html.appendChild(divider);

  // Páginas de productos (6 por página)
  for (let i = 0; i < products.length; i += 6) {
    const page = document.createElement('div');
    page.className = 'page grid-page';
    const chunk = products.slice(i, i + 6);

    chunk.forEach(p => {
      const badges = `<div class="product-badges">
        <span class="badge badge-bio">BIO</span>
        ${p.sinGluten ? '<span class="badge badge-gf">SG</span>' : ''}
        ${p.vegano ? '<span class="badge badge-veg">VEG</span>' : ''}
      </div>`;

      const card = document.createElement('div');
      card.className = 'product-card';
      card.innerHTML = `
        <div class="product-photo">
          <img src="${p.img}" alt="${p.nombre}" loading="lazy" onerror="this.style.opacity=0.15">
        </div>
        <div class="product-body">
          ${badges}
          <div class="product-name">${p.nombre}</div>
          <div class="product-footer">
            <span class="price">€${p.precio.toFixed(2)}</span>
          </div>
        </div>
      `;
      page.appendChild(card);
    });

    html.appendChild(page);
  }
});

const backCover = document.createElement('div');
