  }

  .product-details {

  .product-weight {

    height: 28px;

</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">Bioartesa</div>
    <div class="tagline">Productos ecológicos artesanales</div>
  </div>
</header>

<div class="container" id="catalog"></div>

<button class="cart-button" id="cart-btn" onclick="toggleCart()">
  🛍️
  <div class="cart-badge" id="cart-badge" style="display:none;">0</div>
</button>

<div class="modal-overlay" id="modal-overlay" onclick="toggleCart()"></div>

<div class="modal" id="modal">
  <div class="modal-header">
    <div class="modal-title">Tu Selección</div>
    <button class="modal-close" onclick="toggleCart()">✕</button>
  </div>
  <div class="modal-content" id="cart-items">
    <div class="cart-empty">Aún sin productos</div>
  </div>
  <div class="modal-footer">
    <div class="calc-section">
      <div class="calc-label">Margen de beneficio</div>
      <div class="calc-row">
        <input type="range" id="margin" min="20" max="60" value="40" class="calc-slider" style="width:100%;">
      </div>
      <div class="calc-row">
        <span>Margen</span>
        <span class="calc-row-value" id="margin-val">40%</span>
      </div>
    </div>

    <div class="calc-section">
      <div class="calc-label">Cantidad de cajas</div>
      <div class="calc-row">
        <span>Cajas</span>
        <input type="number" id="num-boxes" min="1" value="1">
      </div>
    </div>

    <div class="calc-result">
      <span>Coste/caja</span>
      <strong id="cost-per-box">€0.00</strong>
    </div>
    <div class="calc-result">
      <span>PVP/caja</span>
      <strong id="pvp-per-box">€0.00</strong>
    </div>
    <div class="calc-result total">
      <span>Beneficio total</span>
      <strong id="profit-total">€0.00</strong>
    </div>

    <button class="copy-btn" onclick="copyBudget()">📋 Copiar presupuesto</button>
  </div>
</div>

const state = { box: {}, margin: 40, numBoxes: 1 };
const categoryOrder = ["Panadería y repostería", "Frutos secos", "Deshidratados", "Chocolates"];

function getBadges(product) {
  const badges = [];
  if (product.bio) badges.push(`<span class="badge badge-bio">BIO</span>`);
  if (product.sinGluten) badges.push(`<span class="badge badge-sg">SG</span>`);
  if (product.vegano) badges.push(`<span class="badge badge-veg">VEG</span>`);
  return badges.join('');
}

function getWeight(nombre) {
  const match = nombre.match(/(\d+(?:\.\d+)?)\s*(?:gr|kg|ml|l)?(?:\s*-|$)/i);
  return match ? match[0].trim() : '';
}

function renderCatalog() {
  const grouped = {};
  categoryOrder.forEach(cat => { grouped[cat] = []; });
  PRODUCTS.forEach(p => {
    if (grouped[p.categoria]) grouped[p.categoria].push(p);
  });

  let html = '';
  categoryOrder.forEach(cat => {
    if (grouped[cat].length === 0) return;
    html += `
      <div class="category-section">
        <div class="category-title">${cat}</div>
        <div class="category-subtitle">Selecciona los productos para armar tu caja</div>
        ${grouped[cat].map(p => `
          <div class="product-row">
            <div class="product-image-wrapper">
              <div class="product-image">
                <img src="${p.img}" alt="${p.nombre}" onerror="this.style.opacity=0.2">
              </div>
            </div>
            <div class="product-details">
              <div class="product-header">
                <div class="product-name">${p.nombre}</div>
                <div class="product-price-line">
                  <div class="price-dots"></div>
                  <div class="product-price">€${p.precio.toFixed(2)}</div>
                </div>
              </div>
              <div class="product-meta">
                <div class="product-weight">${getWeight(p.nombre)}</div>
                <div class="badges">${getBadges(p)}</div>
                <button class="add-to-cart-btn" onclick="addToCart(${p.id})">+ Agregar</button>
              </div>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  });
  document.getElementById('catalog').innerHTML = html;
}

function addToCart(id) {
  state.box[id] = (state.box[id] || 0) + 1;
  renderCart();
}

function removeFromCart(id) {
  delete state.box[id];
  renderCart();
}

function updateQty(id, delta) {
  state.box[id] = Math.max(0, (state.box[id] || 0) + delta);
  if (state.box[id] === 0) delete state.box[id];
  renderCart();
}

function renderCart() {
  const items = Object.entries(state.box).map(([id, qty]) => {
    const p = PRODUCTS.find(x => x.id == id);
    return { p, qty };
  });

  const count = Object.values(state.box).reduce((a,b) => a+b, 0);
  const badge = document.getElementById('cart-badge');
  if (count > 0) {
    badge.textContent = count;
    badge.style.display = 'flex';
  } else {
    badge.style.display = 'none';
  }

  if (items.length === 0) {
    document.getElementById('cart-items').innerHTML = '<div class="cart-empty">Aún sin productos. Selecciona artículos arriba.</div>';
  } else {
    document.getElementById('cart-items').innerHTML = items.map(({p, qty}) => `
      <div class="cart-item">
        <div class="cart-item-image">
          <img src="${p.img}" onerror="this.style.opacity=0.2">
        </div>
        <div class="cart-item-info">
          <div class="cart-item-name">${p.nombre.substring(0,50)}</div>
          <div class="cart-item-price">€${p.precio.toFixed(2)}</div>
          <div class="cart-item-qty">
            <button class="qty-btn" onclick="updateQty(${p.id}, -1)">−</button>
            <div class="qty-display">${qty}</div>
            <button class="qty-btn" onclick="updateQty(${p.id}, 1)">+</button>
            <div class="cart-item-remove" onclick="removeFromCart(${p.id})">Eliminar</div>
          </div>
        </div>
      </div>
    `).join('');
  }

  renderCalc();
}

function boxCost() {
  return Object.entries(state.box).reduce((sum, [id, qty]) => {
    const p = PRODUCTS.find(x => x.id == id);
    return sum + (p ? p.precio * qty : 0);
  }, 0);
}

function renderCalc() {
  const margin = Number(document.getElementById('margin').value) || 40;
  const numBoxes = Math.max(1, Number(document.getElementById('num-boxes').value) || 1);
  const costPerBox = boxCost();
  const pvpPerBox = margin < 100 ? costPerBox / (1 - margin/100) : 0;
  const profitTotal = (pvpPerBox - costPerBox) * numBoxes;

  document.getElementById('margin-val').textContent = margin + '%';
  document.getElementById('cost-per-box').textContent = '€' + costPerBox.toFixed(2);
  document.getElementById('pvp-per-box').textContent = '€' + pvpPerBox.toFixed(2);
  document.getElementById('profit-total').textContent = '€' + profitTotal.toFixed(2);
}

function toggleCart() {
  const overlay = document.getElementById('modal-overlay');
  const modal = document.getElementById('modal');
  overlay.classList.toggle('active');
  modal.classList.toggle('active');
}

function copyBudget() {
  const items = Object.entries(state.box).map(([id, qty]) => {
    const p = PRODUCTS.find(x => x.id == id);
    return `${qty}× ${p.nombre} – €${p.precio.toFixed(2)}`;
  });

  const margin = Number(document.getElementById('margin').value) || 40;
  const numBoxes = Number(document.getElementById('num-boxes').value) || 1;
  const costPerBox = boxCost();
  const pvpPerBox = margin < 100 ? costPerBox / (1 - margin/100) : 0;
  const profitTotal = (pvpPerBox - costPerBox) * numBoxes;

  const text = `*🌾 Bioartesa — Welcome Box*\n\n${items.join('\n')}\n\n───\nCoste por caja: €${costPerBox.toFixed(2)}\nMargen: ${margin}%\nPVP por caja: €${pvpPerBox.toFixed(2)}\nCajas: ${numBoxes}\n\n*Beneficio total: €${profitTotal.toFixed(2)}*`;

  navigator.clipboard.writeText(text).then(() => {
    alert('Presupuesto copiado al portapapeles ✓');
  });
}

document.getElementById('margin').addEventListener('input', renderCalc);
document.getElementById('num-boxes').addEventListener('input', renderCalc);

renderCatalog();
renderCart();
</script>

</body>
