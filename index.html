<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bioartesa — Catálogo de Productos Artesanales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    font-family: "Inter", -apple-system, sans-serif;
    background: #f9f9f7;
    color: #2d2d2d;
    line-height: 1.5;
  }

  .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

  /* HEADER */
  header {
    background: white;
    border-bottom: 1px solid #e0e0e0;
    padding: 20px 0;
    position: sticky;
    top: 0;
    z-index: 90;
  }

  .header-inner {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .logo {
    font-family: "Poppins", sans-serif;
    font-size: 28px;
    font-weight: 700;
    color: #3d6b4a;
    letter-spacing: -0.5px;
  }

  .header-right {
    display: flex;
    gap: 20px;
    align-items: center;
  }

  .nav-toggle {
    display: none;
    background: none;
    border: none;
    font-size: 24px;
    cursor: pointer;
  }

  /* LANDING - CATEGORÍAS */
  .landing {
    display: none;
    padding: 60px 0;
  }

  .landing.active { display: block; }

  .landing-title {
    text-align: center;
    margin-bottom: 50px;
  }

  .landing-title h1 {
    font-family: "Poppins", sans-serif;
    font-size: 42px;
    font-weight: 600;
    color: #2d2d2d;
    margin-bottom: 12px;
  }

  .landing-title p {
    font-size: 16px;
    color: #666;
  }

  .categories-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 30px;
    margin-bottom: 60px;
  }

  .category-card {
    background: white;
    border-radius: 8px;
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    transition: transform 0.3s, box-shadow 0.3s;
    border: 2px solid transparent;
  }

  .category-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 32px rgba(61, 107, 74, 0.1);
    border-color: #3d6b4a;
  }

  .category-card-icon {
    font-size: 56px;
    margin-bottom: 16px;
  }

  .category-card h2 {
    font-family: "Poppins", sans-serif;
    font-size: 18px;
    font-weight: 600;
    color: #2d2d2d;
  }

  /* NAVEGACIÓN CATEGORÍAS */
  .category-nav {
    display: none;
    background: white;
    border-bottom: 1px solid #e0e0e0;
    padding: 12px 0;
    position: sticky;
    top: 80px;
    z-index: 80;
  }

  .category-nav.active { display: block; }

  .category-nav-list {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 0 0 8px 0;
  }

  .category-tab {
    background: none;
    border: none;
    padding: 8px 20px;
    font-size: 14px;
    font-weight: 500;
    color: #666;
    cursor: pointer;
    border-radius: 20px;
    transition: background 0.3s, color 0.3s;
    white-space: nowrap;
  }

  .category-tab:hover {
    background: #f0f0f0;
  }

  .category-tab.active {
    background: #3d6b4a;
    color: white;
  }

  /* VISTA DE PRODUCTOS */
  .products-view {
    display: none;
    padding: 40px 0;
  }

  .products-view.active { display: block; }

  .products-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 24px;
  }

  .product-card {
    background: white;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    transition: transform 0.3s, box-shadow 0.3s;
    display: flex;
    flex-direction: column;
  }

  .product-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.12);
  }

  .product-image {
    width: 100%;
    height: 220px;
    background: linear-gradient(135deg, #f5f5f3 0%, #eae8e5 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .product-image img {
    max-width: 90%;
    max-height: 90%;
    object-fit: contain;
  }

  .product-info {
    padding: 20px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .product-name {
    font-family: "Poppins", sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: #2d2d2d;
    margin-bottom: 6px;
    line-height: 1.3;
  }

  .product-weight {
    font-size: 12px;
    color: #999;
    margin-bottom: 12px;
  }

  .product-badges {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #3d6b4a;
    color: white;
    font-size: 10px;
    font-weight: 600;
  }

  .product-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: auto;
    padding-top: 12px;
    border-top: 1px solid #f0f0f0;
  }

  .product-price {
    font-family: "Poppins", sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: #c97c4e;
  }

  .add-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #3d6b4a;
    color: white;
    border: none;
    font-size: 18px;
    cursor: pointer;
    transition: background 0.3s, transform 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .add-btn:hover {
    background: #2d5a3a;
    transform: scale(1.1);
  }

  /* CARRITO FLOTANTE */
  .cart-button {
    position: fixed;
    bottom: 30px;
    right: 30px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: #3d6b4a;
    color: white;
    border: none;
    cursor: pointer;
    font-size: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 16px rgba(61, 107, 74, 0.3);
    z-index: 200;
    transition: background 0.3s, transform 0.2s;
  }

  .cart-button:hover {
    background: #2d5a3a;
    transform: scale(1.1);
  }

  .cart-badge {
    position: absolute;
    top: -8px;
    right: -8px;
    background: #c97c4e;
    color: white;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 600;
  }

  /* MODAL CARRITO */
  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.4);
    z-index: 300;
    display: none;
  }

  .modal-overlay.active { display: block; }

  .modal {
    position: fixed;
    right: 0;
    top: 0;
    bottom: 0;
    width: 100%;
    max-width: 420px;
    background: white;
    z-index: 301;
    display: flex;
    flex-direction: column;
    box-shadow: -4px 0 16px rgba(0,0,0,0.12);
    transform: translateX(100%);
    transition: transform 0.3s;
  }

  .modal.active { transform: translateX(0); }

  .modal-header {
    padding: 24px 20px;
    border-bottom: 1px solid #e0e0e0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .modal-title {
    font-family: "Poppins", sans-serif;
    font-size: 20px;
    font-weight: 600;
  }

  .modal-close {
    background: none;
    border: none;
    font-size: 24px;
    cursor: pointer;
    color: #999;
  }

  .modal-content {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
  }

  .cart-empty {
    text-align: center;
    color: #999;
    padding: 40px 20px;
    font-size: 14px;
  }

  .cart-item {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
    padding-bottom: 16px;
    border-bottom: 1px solid #f0f0f0;
  }

  .cart-item:last-child { border-bottom: none; }

  .cart-item-image {
    width: 56px;
    height: 56px;
    background: #f5f5f3;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .cart-item-image img {
    max-width: 85%;
    max-height: 85%;
    object-fit: contain;
  }

  .cart-item-info { flex: 1; }
  .cart-item-name { font-size: 12px; font-weight: 600; color: #2d2d2d; margin-bottom: 4px; }
  .cart-item-price { font-size: 11px; color: #c97c4e; margin-bottom: 6px; }

  .cart-item-controls {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .qty-btn {
    width: 20px;
    height: 20px;
    border: 1px solid #e0e0e0;
    background: white;
    cursor: pointer;
    font-size: 11px;
    border-radius: 2px;
  }

  .qty-btn:hover { background: #f5f5f3; }
  .qty-display { font-size: 11px; font-weight: 600; min-width: 16px; text-align: center; }
  .cart-item-remove { font-size: 10px; color: #c97c4e; cursor: pointer; margin-left: auto; }

  .modal-footer {
    border-top: 1px solid #e0e0e0;
    padding: 20px;
    background: white;
  }

  .calc-label { font-size: 11px; font-weight: 600; color: #2d2d2d; margin-bottom: 6px; }
  .calc-row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 8px; align-items: center; }
  .calc-row input { width: 50px; padding: 4px 8px; border: 1px solid #e0e0e0; border-radius: 2px; font-size: 11px; }
  .calc-slider { width: 100%; margin: 6px 0 12px; }
  .calc-result { display: flex; justify-content: space-between; font-size: 12px; padding: 6px 0; }
  .calc-result.total { font-size: 14px; font-weight: 600; color: #3d6b4a; padding-top: 10px; border-top: 1px solid #e0e0e0; }

  .copy-btn {
    width: 100%;
    padding: 12px;
    background: #3d6b4a;
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 16px;
  }

  .copy-btn:hover { background: #2d5a3a; }

  /* FOOTER */
  footer {
    background: white;
    border-top: 1px solid #e0e0e0;
    padding: 40px 0 20px;
    margin-top: 80px;
    font-size: 12px;
    color: #999;
    text-align: center;
  }

  @media (max-width: 768px) {
    .products-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
    .modal { max-width: 100%; }
    .nav-toggle { display: block; }
  }
</style>
</head>
<body>

<header>
  <div class="container">
    <div class="header-inner">
      <div class="logo">🌾 Bioartesa</div>
      <div class="header-right">
        <button class="nav-toggle" id="nav-toggle">☰</button>
      </div>
    </div>
  </div>
</header>

<div class="container">
  <!-- LANDING -->
  <div class="landing active" id="landing">
    <div class="landing-title">
      <h1>Nuestros Productos</h1>
      <p>Artesanales, ecológicos y elaborados en Castilléjar</p>
    </div>
    <div class="categories-grid" id="categories-grid"></div>
  </div>

  <!-- NAVEGACIÓN CATEGORÍAS -->
  <nav class="category-nav" id="category-nav">
    <div class="category-nav-list" id="category-nav-list"></div>
  </nav>

  <!-- VISTA DE PRODUCTOS -->
  <div class="products-view" id="products-view">
    <div class="products-grid" id="products-grid"></div>
  </div>
</div>

<footer>
  <p>© 2012–2026 Bioartesa · Castilléjar, Granada · Ecológico Certificado</p>
</footer>

<button class="cart-button" id="cart-btn" onclick="toggleCart()">
  🛍️
  <div class="cart-badge" id="cart-badge" style="display:none;">0</div>
</button>

<div class="modal-overlay" id="modal-overlay" onclick="toggleCart()"></div>

<div class="modal" id="modal">
  <div class="modal-header">
    <div class="modal-title">Tu Selección</div>
    <button class="modal-close" onclick="toggleCart()">✕</button>
  </div>
  <div class="modal-content" id="cart-items">
    <div class="cart-empty">Aún sin productos</div>
  </div>
  <div class="modal-footer">
    <div>
      <div class="calc-label">Margen</div>
      <div class="calc-row">
        <input type="range" id="margin" min="20" max="60" value="40" class="calc-slider" style="width:100%;">
      </div>
      <div class="calc-row">
        <span>Margen:</span>
        <span id="margin-val">40%</span>
      </div>
    </div>
    <div style="margin-top: 16px;">
      <div class="calc-label">Cajas</div>
      <div class="calc-row">
        <input type="number" id="num-boxes" min="1" value="1" style="width:60px;">
      </div>
    </div>
    <div class="calc-result">
      <span>Coste:</span>
      <strong id="cost-per-box">€0.00</strong>
    </div>
    <div class="calc-result">
      <span>PVP:</span>
      <strong id="pvp-per-box">€0.00</strong>
    </div>
    <div class="calc-result total">
      <span>Beneficio Total</span>
      <strong id="profit-total">€0.00</strong>
    </div>
    <button class="copy-btn" onclick="copyBudget()">📋 Copiar Presupuesto</button>
  </div>
</div>

const state = { box: {}, margin: 40, numBoxes: 1, category: null };
const categoryOrder = ["Panadería y repostería", "Frutos secos", "Deshidratados", "Chocolates"];
const categoryIcons = { "Panadería y repostería": "🍪", "Frutos secos": "🥜", "Deshidratados": "🍑", "Chocolates": "🍫" };

function getBadges(p) {
  const badges = [];
  if (p.bio) badges.push('BIO');
  if (p.sinGluten) badges.push('SG');
  if (p.vegano) badges.push('VEG');
  return badges.map(b => `<span class="badge">${b}</span>`).join('');
}

function getWeight(nombre) {
  const match = nombre.match(/(\d+(?:\.\d+)?)\s*(?:gr|kg|ml|l)?(?:\s*-|$)/i);
  return match ? match[0].trim() : '';
}

function initLanding() {
  const grid = document.getElementById('categories-grid');
  grid.innerHTML = categoryOrder.map(cat => `
    <div class="category-card" onclick="showCategory('${cat}')">
      <div class="category-card-icon">${categoryIcons[cat]}</div>
      <h2>${cat}</h2>
    </div>
  `).join('');
}

function showCategory(cat) {
  state.category = cat;
  document.getElementById('landing').classList.remove('active');
  document.getElementById('category-nav').classList.add('active');
  document.getElementById('products-view').classList.add('active');
  renderCategoryNav();
  renderProducts();
}

function renderCategoryNav() {
  const list = document.getElementById('category-nav-list');
  list.innerHTML = categoryOrder.map(cat => `
    <button class="category-tab ${cat === state.category ? 'active' : ''}" onclick="showCategory('${cat}')">${categoryIcons[cat]} ${cat}</button>
  `).join('');
}

function renderProducts() {
  const products = PRODUCTS.filter(p => p.categoria === state.category);
  const grid = document.getElementById('products-grid');
  grid.innerHTML = products.map(p => `
    <div class="product-card">
      <div class="product-image"><img src="${p.img}" alt="${p.nombre}" onerror="this.style.opacity=0.2"></div>
      <div class="product-info">
        <div class="product-name">${p.nombre}</div>
        <div class="product-weight">${getWeight(p.nombre)}</div>
        <div class="product-badges">${getBadges(p)}</div>
        <div class="product-footer">
          <div class="product-price">€${p.precio.toFixed(2)}</div>
          <button class="add-btn" onclick="addToCart(${p.id})">+</button>
        </div>
      </div>
    </div>
  `).join('');
}

function addToCart(id) {
  state.box[id] = (state.box[id] || 0) + 1;
  renderCart();
}

function removeFromCart(id) {
  delete state.box[id];
  renderCart();
}

function updateQty(id, delta) {
  state.box[id] = Math.max(0, (state.box[id] || 0) + delta);
  if (state.box[id] === 0) delete state.box[id];
  renderCart();
}

function renderCart() {
  const items = Object.entries(state.box).map(([id, qty]) => {
    const p = PRODUCTS.find(x => x.id == id);
    return { p, qty };
  });

  const count = Object.values(state.box).reduce((a,b) => a+b, 0);
  const badge = document.getElementById('cart-badge');
  if (count > 0) {
    badge.textContent = count;
    badge.style.display = 'flex';
  } else {
    badge.style.display = 'none';
  }

  if (items.length === 0) {
    document.getElementById('cart-items').innerHTML = '<div class="cart-empty">Aún sin productos</div>';
  } else {
    document.getElementById('cart-items').innerHTML = items.map(({p, qty}) => `
      <div class="cart-item">
        <div class="cart-item-image"><img src="${p.img}" onerror="this.style.opacity=0.2"></div>
        <div class="cart-item-info">
          <div class="cart-item-name">${p.nombre.substring(0,50)}</div>
          <div class="cart-item-price">€${p.precio.toFixed(2)}</div>
          <div class="cart-item-controls">
            <button class="qty-btn" onclick="updateQty(${p.id}, -1)">−</button>
            <div class="qty-display">${qty}</div>
            <button class="qty-btn" onclick="updateQty(${p.id}, 1)">+</button>
            <div class="cart-item-remove" onclick="removeFromCart(${p.id})">✕</div>
          </div>
        </div>
      </div>
    `).join('');
  }
  renderCalc();
}

function boxCost() {
  return Object.entries(state.box).reduce((sum, [id, qty]) => {
    const p = PRODUCTS.find(x => x.id == id);
    return sum + (p ? p.precio * qty : 0);
  }, 0);
}

function renderCalc() {
  const margin = Number(document.getElementById('margin').value) || 40;
  const numBoxes = Math.max(1, Number(document.getElementById('num-boxes').value) || 1);
  const costPerBox = boxCost();
  const pvpPerBox = margin < 100 ? costPerBox / (1 - margin/100) : 0;
  const profitTotal = (pvpPerBox - costPerBox) * numBoxes;

  document.getElementById('margin-val').textContent = margin + '%';
  document.getElementById('cost-per-box').textContent = '€' + costPerBox.toFixed(2);
  document.getElementById('pvp-per-box').textContent = '€' + pvpPerBox.toFixed(2);
  document.getElementById('profit-total').textContent = '€' + profitTotal.toFixed(2);
}

function toggleCart() {
  document.getElementById('modal-overlay').classList.toggle('active');
  document.getElementById('modal').classList.toggle('active');
}

function copyBudget() {
  const items = Object.entries(state.box).map(([id, qty]) => {
    const p = PRODUCTS.find(x => x.id == id);
    return `${qty}× ${p.nombre} – €${p.precio.toFixed(2)}`;
  });

  const margin = Number(document.getElementById('margin').value) || 40;
  const numBoxes = Number(document.getElementById('num-boxes').value) || 1;
  const costPerBox = boxCost();
  const pvpPerBox = margin < 100 ? costPerBox / (1 - margin/100) : 0;
  const profitTotal = (pvpPerBox - costPerBox) * numBoxes;

  const text = `🌾 Bioartesa — Welcome Box\n\n${items.join('\n')}\n\n──────\nCoste/caja: €${costPerBox.toFixed(2)}\nMargen: ${margin}%\nPVP/caja: €${pvpPerBox.toFixed(2)}\nCajas: ${numBoxes}\n\nBeneficio total: €${profitTotal.toFixed(2)}`;

  navigator.clipboard.writeText(text).then(() => alert('Copiado ✓'));
}

document.getElementById('margin').addEventListener('input', renderCalc);
document.getElementById('num-boxes').addEventListener('input', renderCalc);

initLanding();
</script>
